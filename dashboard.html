<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issues Tracker Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="./assets/github-logo.png">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .tab-active {
            background-color: #7c3aed;
            color: white !important;
            border-color: #7c3aed !important;
        }

        .card-open {
            border-top: 3px solid #22c55e;
        }

        .card-closed {
            border-top: 3px solid #a855f7;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e9d5ff;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .issue-card {
            transition: box-shadow .2s, transform .15s
        }

        .issue-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, .1);
            transform: translateY(-2px)
        }

        .priority-high {
            background: #fee2e2;
            color: #dc2626
        }

        .priority-medium {
            background: #fef9c3;
            color: #ca8a04
        }

        .priority-low {
            background: #dcfce7;
            color: #16a34a
        }

        .label-bug {
            background: #fee2e2;
            color: #dc2626
        }

        .label-help {
            background: #fff7ed;
            color: #ea580c
        }

        .label-def {
            background: #f1f5f9;
            color: #475569
        }

        .modal-bg {
            background: rgba(0, 0, 0, .45)
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-sm px-6 py-3 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-full flex items-center justify-center">
                <img src="./assets/github-logo.png">
            </div>
            <span class="font-semibold text-gray-800 text-base">GitHub Issues Tracker</span>
        </div>
        <div class="flex items-center gap-2">
            <div class="relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input id="searchInput" type="text" placeholder="Search issues..." onkeydown="handleSearchKey(event)"
                    class="pl-9 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-300 w-52 md:w-72" />
            </div>

            <button
                class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                + New Issue
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 mt-8 pb-12">

        <!--Count Section -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="flex items-center justify-between px-5 pt-5 pb-4 border-b border-gray-100">
                <div class="flex gap-2">
                    <button id="allBtn" onclick="filterIssues('all')"
                        class="tab-active px-5 py-1.5 rounded-full text-sm font-medium border transition">All</button>
                    <button id="openBtn" onclick="filterIssues('open')"
                        class="px-5 py-1.5 rounded-full text-sm font-medium border border-gray-200 text-gray-600 transition">Open</button>
                    <button id="closedBtn" onclick="filterIssues('closed')"
                        class="px-5 py-1.5 rounded-full text-sm font-medium border border-gray-200 text-gray-600 transition">Closed</button>
                </div>
                <div class="flex items-center gap-4 text-sm text-gray-500">
                    <span class="flex items-center gap-1.5"><span
                            class="w-2.5 h-2.5 rounded-full bg-green-500 inline-block"></span>Open</span>
                    <span class="flex items-center gap-1.5"><span
                            class="w-2.5 h-2.5 rounded-full bg-purple-500 inline-block"></span>Closed</span>
                </div>
            </div>
            <div class="flex items-center gap-3 px-5 py-4">
                <div class="w-9 h-9 rounded-full bg-purple-100 flex items-center justify-center">
                    <img src="./assets/Aperture.png">
                </div>
                <div>
                    <p id="issueCount" class="font-bold text-gray-800 text-base">0 Issues</p>
                    <p class="text-gray-400 text-xs">Track and manage your project issues</p>
                </div>
            </div>
        </div>

        <div id="loader" class="flex justify-center mt-10 hidden">
            <div class="spinner"></div>
        </div>

        <div id="noResults" class="hidden text-center text-gray-400 mt-10 text-sm">No issues found.</div>

        <div id="issueContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 mt-6"></div>

    </div>

    <div id="modal" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 px-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 relative max-h-[90vh] overflow-y-auto">

            <div id="modalContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
